# File: pyproject.toml
# Version: 1.2.0 | Release Date: 2026-11-12

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycognition"
version = "1.2.0"
description = "Dual-tier neuro-symbolic cognitive orchestration framework with telemetry-driven skill refactoring and capability-scoped AST sandboxing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [
    { name = "Oleh Riabtsev" }
]
maintainers = [
    { name = "Oleh Riabtsev" }
]
keywords = [
    "neuro-symbolic-ai",
    "cognitive-architecture",
    "autonomous-agents",
    "self-healing-systems",
    "skill-crystallization",
    "ast-security",
    "telemetry-refactoring",
    "llm-orchestration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Security"
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
parsing = [
    "beautifulsoup4>=4.12.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "beautifulsoup4>=4.12.0"
]

[project.urls]
Homepage = "https://github.com/MasterUaKi/pycognition"
Repository = "https://github.com/MasterUaKi/pycognition"
Issues = "https://github.com/MasterUaKi/pycognition/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycognition*"]
